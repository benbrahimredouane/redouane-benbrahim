<section class="hero" id="top">
  <div class="container hero__inner">
    <div class="hero__content">
      <p class="hero__greeting">Hi, my name is</p>
      <h1 class="hero__name">{{ portfolio.name }}</h1>
      <h2 class="hero__role">{{ portfolio.role }}</h2>
      <p class="hero__tagline">{{ portfolio.tagline }}</p>

      <div class="hero__actions">
        <a class="btn btn--primary" href="#projects">View my work</a>
        <a class="btn btn--outline" href="#contact">Get in touch</a>
      </div>

      <ul class="hero__tech" aria-label="Technologies">
        @for (tech of portfolio.heroTech; track tech) {
          <li class="tag">{{ tech }}</li>
        }
      </ul>
    </div>

    <div class="hero__visual" aria-hidden="true">
      <div class="code-card">
        <div class="code-card__bar">
          <span class="code-card__dot"></span>
          <span class="code-card__dot"></span>
          <span class="code-card__dot"></span>
          <span class="code-card__file">portfolio.component.ts</span>
        </div>
        <pre class="code-card__body"><code>{{ codeSample }}</code></pre>
      </div>
    </div>
  </div>
</section>
